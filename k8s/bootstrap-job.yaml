apiVersion: batch/v1
kind: Job
metadata:
  name: offscript-bootstrap
  namespace: offscript
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: offscript
        app.kubernetes.io/component: bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ghcr.io/hjarchivenote/offscript-budapest@sha256:eea0242073351d2ccbb5c2690970f1b2fa47ee01899df821ef35115f62d14969
          imagePullPolicy: IfNotPresent
          command: [python, -m, app.bootstrap]
          envFrom:
            - configMapRef:
                name: offscript-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          volumeMounts:
            - name: auth
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          secret:
            secretName: offscript-db-auth
            defaultMode: 0440
            items:
              - key: db_password
                path: db_password
        - name: tmp
          emptyDir:
            medium: Memory
