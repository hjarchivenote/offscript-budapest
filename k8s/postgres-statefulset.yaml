apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: offscript-db
  namespace: offscript
spec:
  serviceName: offscript-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: offscript
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: offscript
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: offscript
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/db_admin_password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, postgres, -d, offscript]
            periodSeconds: 2
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, postgres, -d, offscript]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, postgres, -d, offscript]
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: auth
              mountPath: /run/secrets
              readOnly: true
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: sockets
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          secret:
            secretName: offscript-db-auth
            defaultMode: 0440
            items:
              - key: db_password
                path: db_password
              - key: db_admin_password
                path: db_admin_password
        - name: init-sql
          configMap:
            name: offscript-db-init
        - name: sockets
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
