apiVersion: apps/v1
kind: Deployment
metadata:
  name: offscript
  namespace: offscript
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: offscript
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: offscript
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/hjarchivenote/offscript-budapest@sha256:eea0242073351d2ccbb5c2690970f1b2fa47ee01899df821ef35115f62d14969
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: offscript-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: [python, -c, "import time; time.sleep(3)"]
          volumeMounts:
            - name: auth
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          secret:
            secretName: offscript-db-auth
            defaultMode: 0440
            items:
              - key: db_password
                path: db_password
        - name: tmp
          emptyDir:
            medium: Memory
