name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint and automated tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-runtime.lock
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.lock -c requirements-runtime.lock
          python -m pip check
      - name: Run quality checks
        run: python -u -m scripts.ci quality
      - name: Keep Python test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-test-results
          overwrite: true
          path: .local/ci/python-tests.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Build, security and real application checks
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OFFSCRIPT_IMAGE: offscript:ci-${{ github.sha }}
      CI_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out the same source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-runtime.lock
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.lock -c requirements-runtime.lock
          python -m pip check
      - name: Validate the exact image
        run: python -u -m scripts.ci container
      - name: Keep scan and browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-check-results
          overwrite: true
          path: |
            .local/ci/reports/security.json
            .local/ci/reports/source-secrets.json
            .local/ci/reports/browser-desktop.png
            .local/ci/reports/browser-mobile.png
            .local/ci/reports/browser-failure.png
            .local/ci/reports/browser-trace.zip
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the validated image for a later release step
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-image-${{ github.sha }}
          overwrite: true
          path: |
            .local/ci/image.tar
            .local/ci/image.tar.sha256
            .local/ci/validated-image.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  kubernetes:
    name: Kubernetes configuration and recovery checks
    needs: [quality, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out the same source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-runtime.lock
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.lock -c requirements-runtime.lock
          python -m pip check
      - name: Install checksum-pinned Kubernetes tools
        run: |
          curl --fail --location --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 --output "$RUNNER_TEMP/kind"
          printf '%s  %s\n' aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d "$RUNNER_TEMP/kind" | sha256sum --check
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl --output "$RUNNER_TEMP/kubectl"
          printf '%s  %s\n' 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f "$RUNNER_TEMP/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind" "$RUNNER_TEMP/kubectl"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
          printf 'OFFSCRIPT_KUBERNETES_TEST_CONFIG=%s/offscript-ci-kubeconfig\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'OFFSCRIPT_KUBECTL=%s/kubectl\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'OFFSCRIPT_KUBERNETES_IMAGE_DIR=%s/.local/ci\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Retrieve the exact image validated by the container job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-image-${{ github.sha }}
          path: .local/ci
          digest-mismatch: error
      - name: Create an isolated cluster from the checked-in kind configuration
        run: |
          mkdir -p .local/ci
          python -m scripts.kubernetes_image config
          kind create cluster --name offscript-ci --config .local/ci/kind-ci.yaml --kubeconfig "$OFFSCRIPT_KUBERNETES_TEST_CONFIG" --wait 120s
          kubectl --kubeconfig "$OFFSCRIPT_KUBERNETES_TEST_CONFIG" --context kind-offscript-ci apply -f k8s/namespace.yaml
      - name: Verify and import the same image archive without rebuilding
        run: python -u -m scripts.kubernetes_image load --kubeconfig "$OFFSCRIPT_KUBERNETES_TEST_CONFIG"
      - name: Check schemas, safeguards, setup and failure recovery
        run: python -u -m pytest -q tests/test_kubernetes_integration.py --junitxml=.local/ci/kubernetes-tests.xml
      - name: Bind passing Kubernetes results to both running image IDs
        run: python -u -m scripts.kubernetes_image receipt --kubeconfig "$OFFSCRIPT_KUBERNETES_TEST_CONFIG"
      - name: Keep the exact-image Kubernetes receipt for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes-validated-image-${{ github.sha }}
          path: .local/ci/kubernetes-image.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Record non-sensitive cluster state
        if: ${{ always() }}
        run: |
          if [[ -x "$OFFSCRIPT_KUBECTL" && -f "$OFFSCRIPT_KUBERNETES_TEST_CONFIG" ]]; then
            "$OFFSCRIPT_KUBECTL" --kubeconfig "$OFFSCRIPT_KUBERNETES_TEST_CONFIG" --context kind-offscript-ci -n offscript get pods,services,jobs,pvc -o wide > .local/ci/kubernetes-resources.txt || true
          fi
      - name: Keep Kubernetes check results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes-check-results
          overwrite: true
          path: |
            .local/ci/kubernetes-tests.xml
            .local/ci/kubernetes-resources.txt
            .local/ci/kubernetes-runtime.json
            .local/ci/kubernetes-image.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove only this job's disposable cluster
        if: ${{ always() }}
        run: |
          if [[ -x "$RUNNER_TEMP/kind" ]]; then
            "$RUNNER_TEMP/kind" delete cluster --name offscript-ci --kubeconfig "$RUNNER_TEMP/offscript-ci-kubeconfig"
          fi

  gate:
    name: CI passed
    if: ${{ always() }}
    needs: [quality, container, kubernetes]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      CONTAINER_RESULT: ${{ needs.container.result }}
      KUBERNETES_RESULT: ${{ needs.kubernetes.result }}
    steps:
      - name: Require every validation job to succeed
        run: |
          if [[ "$QUALITY_RESULT" == success && "$CONTAINER_RESULT" == success && "$KUBERNETES_RESULT" == success ]]; then
            echo 'All required checks passed.'
          else
            echo '::error::A required validation failed, was skipped, or was cancelled.'
            exit 1
          fi

  publish:
    name: Publish and pull-verify the validated image
    needs: [quality, container, kubernetes, gate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Retrieve the image checked by this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-image-${{ github.sha }}
          path: .local/ci
          digest-mismatch: error
      - name: Retrieve the matching exact-image Kubernetes receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kubernetes-validated-image-${{ github.sha }}
          path: .local/ci
          digest-mismatch: error
      - name: Publish the exact image and verify a registry pull
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u -m scripts.publish_image
      - name: Keep the published image digest and validation receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-image-${{ github.sha }}
          overwrite: true
          path: .local/ci/published-image.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Bind the publication to its deployment configuration
        run: python -u -m scripts.release_package
      - name: Request delivery by the private local worker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-request-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .local/ci/delivery/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7
