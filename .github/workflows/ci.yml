name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint and automated tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-runtime.lock
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.lock -c requirements-runtime.lock
          python -m pip check
      - name: Run quality checks
        run: python -u -m scripts.ci quality
      - name: Keep Python test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-test-results
          path: .local/ci/python-tests.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Build, security and real application checks
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OFFSCRIPT_IMAGE: offscript:ci-${{ github.sha }}
      CI_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out the same source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-runtime.lock
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.lock -c requirements-runtime.lock
          python -m pip check
      - name: Validate the exact image
        run: python -u -m scripts.ci container
      - name: Keep scan and browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-check-results
          path: |
            .local/ci/reports/security.json
            .local/ci/reports/source-secrets.json
            .local/ci/reports/browser-desktop.png
            .local/ci/reports/browser-mobile.png
            .local/ci/reports/browser-failure.png
            .local/ci/reports/browser-trace.zip
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the validated image for a later release step
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-image-${{ github.sha }}
          path: |
            .local/ci/image.tar
            .local/ci/image.tar.sha256
            .local/ci/validated-image.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  gate:
    name: CI passed
    if: ${{ always() }}
    needs: [quality, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      CONTAINER_RESULT: ${{ needs.container.result }}
    steps:
      - name: Require every validation job to succeed
        run: |
          if [[ "$QUALITY_RESULT" == success && "$CONTAINER_RESULT" == success ]]; then
            echo 'All required checks passed.'
          else
            echo '::error::A required validation failed, was skipped, or was cancelled.'
            exit 1
          fi

  publish:
    name: Publish and pull-verify the validated image
    needs: [quality, container, gate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Retrieve the image checked by this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-image-${{ github.sha }}
          path: .local/ci
          digest-mismatch: error
      - name: Publish the exact image and verify a registry pull
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u -m scripts.publish_image
      - name: Keep the published image digest and validation receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-image-${{ github.sha }}
          path: .local/ci/published-image.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publication_gate_probe:
    name: Publication gate positive control (no registry writes)
    needs: [quality, container, gate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/verify-publication-blocking' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Check out the verification revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the production dependency policy and record the control
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml').read_text()
          def job(name):
              body = workflow.split('\n  ' + name + ':\n', 1)[1]
              return re.split(r'(?m)^  [A-Za-z_][A-Za-z0-9_-]*:\s*$', body, maxsplit=1)[0]
          def setting(body, key):
              return re.search(r'(?m)^    ' + key + r': (.+)$', body).group(1)
          production, control = job('publish'), job('publication_gate_probe')
          assert setting(production, 'needs') == setting(control, 'needs')
          assert setting(production, 'if').replace('refs/heads/main', 'refs/heads/codex/verify-publication-blocking') == setting(control, 'if')
          permissions = re.search(r'(?m)^    permissions:\n((?:      [^\n]+\n)+)', control).group(1)
          assert permissions.strip() == 'contents: read'
          results = json.loads(os.environ['NEEDS_RESULTS'])
          assert set(results) == {'quality', 'container', 'gate'}
          assert all(job['result'] == 'success' for job in results.values())
          proof = {
              'kind': 'dependency-gate-positive-control',
              'commit': os.environ['GITHUB_SHA'],
              'same_production_dependencies': True,
              'only_branch_matcher_substituted': True,
              'registry_write_attempted': False,
              'needs': results,
          }
          output = Path('.local/ci/publication-gate-proof.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(proof, indent=2) + '\n')
          print('PASS publication dependency control: all prerequisites succeeded; registry writing remains disabled.')
          PY
      - name: Keep the read-only gate proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-gate-proof-${{ github.sha }}
          path: .local/ci/publication-gate-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
